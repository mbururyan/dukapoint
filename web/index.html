<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DukaPoint – point of sale for dukas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DukaPoint">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>DukaPoint</title>
  <style>
    html, body { margin: 0; background: #FFFFFF; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity .3s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    .boot-logo { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; }
    .boot-logo svg { display: block; }
    .boot-name { font-size: 28px; font-weight: 700; color: #111827; letter-spacing: -0.5px; }
    .boot-track { width: 160px; height: 4px; border-radius: 2px; background: #F5F3FF; overflow: hidden; }
    .boot-bar {
      width: 40%; height: 100%; border-radius: 2px; background: #6D28D9;
      animation: boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading DukaPoint">
    <div class="boot-logo">
      <!-- R1A, drawn inline so it shows before any file has downloaded -->
      <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" fill="#4C1D95"/>
        <g fill="none" stroke="#F59E0B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 54 V42 L50 18 L80 42 V54"/>
          <path d="M20 66 V80 H33 M67 80 H80 V66"/>
        </g>
        <rect x="30.0" y="62.0" width="3.5" height="10.0" fill="#FFFFFF"/>
        <rect x="35.7" y="59.3" width="1.8" height="12.8" fill="#FFFFFF"/>
        <rect x="39.6" y="56.5" width="2.4" height="15.5" fill="#FFFFFF"/>
        <rect x="44.0" y="53.8" width="1.8" height="18.3" fill="#FFFFFF"/>
        <rect x="47.9" y="51.0" width="4.1" height="21.0" fill="#FFFFFF"/>
        <rect x="54.2" y="48.3" width="1.2" height="23.8" fill="#FFFFFF"/>
        <rect x="57.5" y="45.5" width="2.9" height="26.5" fill="#FFFFFF"/>
        <rect x="62.6" y="42.8" width="1.8" height="29.3" fill="#FFFFFF"/>
        <rect x="66.5" y="40.0" width="3.5" height="32.0" fill="#F59E0B"/>
      </svg>
    </div>
    <div class="boot-name">DukaPoint</div>
    <div class="boot-track"><div class="boot-bar"></div></div>
  </div>
  <script>
    // Flutter fires this once its first frame is painted. Fade, then remove
    // the loader so it can't sit on top of the app and swallow taps.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
