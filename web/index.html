<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DukaPoint – point of sale for dukas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DukaPoint">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>DukaPoint</title>
  <style>
    html, body { margin: 0; background: #FFFFFF; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity .3s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    .boot-logo {
      width: 72px; height: 72px; border-radius: 18px; background: #6D28D9;
      display: flex; align-items: center; justify-content: center;
    }
    .boot-name { font-size: 28px; font-weight: 700; color: #111827; letter-spacing: -0.5px; }
    .boot-track { width: 160px; height: 4px; border-radius: 2px; background: #F5F3FF; overflow: hidden; }
    .boot-bar {
      width: 40%; height: 100%; border-radius: 2px; background: #6D28D9;
      animation: boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading DukaPoint">
    <div class="boot-logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/>
        <path d="M5 13v8h14v-8"/><path d="M10 21v-5h4v5"/>
      </svg>
    </div>
    <div class="boot-name">DukaPoint</div>
    <div class="boot-track"><div class="boot-bar"></div></div>
  </div>
  <script>
    // Flutter fires this once its first frame is painted. Fade, then remove
    // the loader so it can't sit on top of the app and swallow taps.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
